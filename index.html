  return p.length >= 8 && /[a-zA-Z]/.test(p) && /[0-9]/.test(p);
}

// Simple replacement for storage, backed by Firestore.
// shared=true  -> collection "shared", visible to everyone
// shared=false -> collection "local", stored per-browser using localStorage (personal, e.g. "who am I signed in as")
const storage = {
  async get(key, shared) {
    if (!shared) {
      const v = localStorage.getItem('inv_' + key);
      return v === null ? null : { key, value: v, shared: false };
    }
    const snap = await getDoc(doc(db, 'shared', key));
    if (!snap.exists()) return null;
    return { key, value: snap.data().value, shared: true };
  },
  async set(key, value, shared) {
    if (!shared) {
      localStorage.setItem('inv_' + key, value);
      return { key, value, shared: false };
    }
    await setDoc(doc(db, 'shared', key), { value });
    return { key, value, shared: true };
  },
  async delete(key, shared) {
    if (!shared) {
      localStorage.removeItem('inv_' + key);
      return { key, deleted: true, shared: false };
    }
    await deleteDoc(doc(db, 'shared', key));
    return { key, deleted: true, shared: true };
  },
};

const CATS = ['General', 'Electronics', 'Apparel', 'Food & Bev', 'Hardware', 'Office'];

function genSKU(existing) {
  let n;
  do { n = 'SKU-' + String(Math.floor(1000 + Math.random() * 9000)); }
  while (existing.some(p => p.sku === n));
  return n;
}

function Barcode({ seed }) {
  const bars = [];
  let s = 0;
  for (let i = 0; i < seed.length; i++) s += seed.charCodeAt(i) * (i + 1);
  for (let i = 0; i < 28; i++) {
    s = (s * 9301 + 49297) % 233280;
    const w = 1 + (s % 3);
    bars.push(w);
  }
  return (
    <svg width="100%" height="24" viewBox={`0 0 ${bars.reduce((a, b) => a + b, 0) + bars.length} 24`} preserveAspectRatio="none">
      {(() => {
        let x = 0;
        return bars.map((w, i) => {
          const rect = i % 2 === 0 ? (
            <rect key={i} x={x} y="0" width={w} height="24" fill="#1B1F1D" />
          ) : null;
          x += w + 1;
          return rect;
        });
      })()}
    </svg>
  );
}

function Gauge({ pct, tone }) {
  const color = tone === 'critical' ? '#C1502E' : tone === 'low' ? '#E2A83C' : '#5C8A63';
  return (
    <div style={{ height: 6, background: '#D9DACF', borderRadius: 0, overflow: 'hidden', border: '1px solid #1B1F1D22' }}>
      <div style={{ height: '100%', width: `${Math.min(100, pct)}%`, background: color, transition: 'width .3s' }} />
    </div>
  );
}

function playAlert(critical) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.value = critical ? 440 : 660;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
    if (critical) {
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.type = 'square';
      osc2.frequency.value = 440;
      gain2.gain.setValueAtTime(0.001, ctx.currentTime + 0.25);
      gain2.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.26);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.43);
      osc2.start(ctx.currentTime + 0.25);
      osc2.stop(ctx.currentTime + 0.45);
    }
  } catch (e) { /* audio not available */ }
}

      category: form.category,
      quantity: Number(form.quantity) || 0,
      reorder: Number(form.reorder) || 5,
      price: Number(form.price) || 0,

    const next = products.map(p => p.id === editTarget.id ? {

      name: editForm.name.trim(),
      category: editForm.category,
      reorder: Number(editForm.reorder) || 0,

            />
            <input
              type="password" placeholder="New password (8+ chars, letters + numbers)" value={newPin}
              onChange={e => setNewPin(e.target.value)}
              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 12px', fontSize: 14, fontFamily: mono, border: `1px solid ${ink}44`, marginBottom: 10, borderRadius: 0 }}
            />
            <input
              type="password" placeholder="Confirm new password" value={newPinConfirm}
              onChange={e => setNewPinConfirm(e.target.value)}
              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 12px', fontSize: 14, fontFamily: mono, border: `1px solid ${ink}44`, marginBottom: 12, borderRadius: 0 }}
            />
            {pinError && <div style={{ color: rust, fontSize: 12, marginBottom: 12 }}>{pinError}</div>}
            <div style={{ display: 'flex', gap: 8 }}>
              <button
                onClick={() => {
                  if (currentPinCheck.trim() !== sharedPin) { setPinError('Current password is incorrect.'); return; }
                  changePin();
                }}
                style={{ flex: 1, padding: '10px 0', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: ink, color: paper, border: 'none', cursor: 'pointer' }}
              >
                Save new PIN
              </button>
              <button onClick={() => { setShowChangePin(false); setPinError(''); setCurrentPinCheck(''); setNewPin(''); setNewPinConfirm(''); }} style={{ flex: 1, padding: '10px 0', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: 'none', border: `1px solid ${ink}44`, cursor: 'pointer' }}>
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}

      {error && (
        <div style={{ background: rust, color: '#fff', padding: '8px 24px', fontSize: 13 }}>{error}</div>
      )}

      {view === 'dashboard' && (
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 1, background: ink }}>
        {[
          { label: 'SKUs on file', value: products.length },
          { label: 'Total units', value: totalUnits.toLocaleString() },
          { label: 'Inventory value', value: '₵' + totalValue.toLocaleString(undefined, { maximumFractionDigits: 0 }) },
          { label: 'Low stock', value: lowStock, alert: lowStock > 0 },
        ].map((s, i) => (
          <div key={i} onClick={() => setView('products')} style={{ background: paperDark, padding: '14px 20px', cursor: 'pointer' }}>
            <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: 'uppercase', color: steel, marginBottom: 4 }}>{s.label}</div>
            <div style={{ fontFamily: mono, fontSize: 24, fontWeight: 700, color: s.alert ? rust : ink }}>{s.value}</div>
          </div>
        ))}
      </div>
      )}

      {view === 'products' && !selectedId && (
      <div style={{ padding: '18px 24px', display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center', borderBottom: `1px solid ${ink}22` }}>
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="Search name or SKU…"
          style={{ flex: '1 1 200px', padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, background: paper, fontFamily: display, borderRadius: 0 }}
        />
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, background: paper, fontFamily: display, borderRadius: 0 }}>
          <option>All</option>
          {CATS.map(c => <option key={c}>{c}</option>)}
        </select>
        <button
          onClick={() => setShowAdd(true)}
          style={{ padding: '9px 18px', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: ink, color: paper, border: 'none', cursor: 'pointer' }}
        >
          + Add product
        </button>
      </div>
      )}

      {showAdd && view === 'products' && (
        <div style={{ padding: '18px 24px', background: '#DFDCCB', borderBottom: `1px solid ${ink}22` }}>
          <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: steel, marginBottom: 12, fontWeight: 700 }}>New line item</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10, marginBottom: 12 }}>
            <input placeholder="Product name" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, borderRadius: 0, fontFamily: display }} />
            <input placeholder="SKU (optional, auto if blank)" value={form.sku} onChange={e => setForm({ ...form, sku: e.target.value })} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, borderRadius: 0, fontFamily: mono }} />
            <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, borderRadius: 0, fontFamily: display }}>
              {CATS.map(c => <option key={c}>{c}</option>)}
            </select>
            <input placeholder="Starting qty" type="number" value={form.quantity} onChange={e => setForm({ ...form, quantity: e.target.value })} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, borderRadius: 0, fontFamily: mono }} />
            <input placeholder="Reorder point" type="number" value={form.reorder} onChange={e => setForm({ ...form, reorder: e.target.value })} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, borderRadius: 0, fontFamily: mono }} />
            <input placeholder="Unit price (₵)" type="number" value={form.price} onChange={e => setForm({ ...form, price: e.target.value })} style={{ padding: '9px 12px', fontSize: 13, border: `1px solid ${ink}44`, borderRadius: 0, fontFamily: mono }} />
          </div>
          {formError && <div style={{ color: rust, fontSize: 12, marginBottom: 10 }}>{formError}</div>}
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={addProduct} disabled={!form.name.trim() || saving} style={{ padding: '9px 18px', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: moss, color: '#fff', border: 'none', cursor: 'pointer', opacity: form.name.trim() ? 1 : 0.5 }}>
              {saving ? 'Saving…' : 'Save item'}
            </button>
            <button onClick={() => { setShowAdd(false); setFormError(''); }} style={{ padding: '9px 18px', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: 'none', color: ink, border: `1px solid ${ink}44`, cursor: 'pointer' }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {view === 'products' && !selectedId && (
      <div style={{ padding: '20px 24px' }}>
        {products.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '60px 20px', color: steel }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>The shelf is empty</div>
            <div style={{ fontSize: 13 }}>Add your first product to start the manifest.</div>
          </div>
        ) : filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '40px 20px', color: steel, fontSize: 13 }}>No items match that search.</div>
        ) : (
          <div style={{ border: `1px solid ${ink}22` }}>
            {filtered.map((p, i) => {
              const tone = p.quantity === 0 ? 'critical' : p.quantity <= p.reorder ? 'low' : 'ok';
              return (
                <div
                  key={p.id}
                  onClick={() => setSelectedId(p.id)}
                  style={{
                    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                    padding: '14px 16px', cursor: 'pointer', background: i % 2 === 0 ? '#fff' : paperDark,
                    borderBottom: `1px solid ${ink}11`,
                  }}
                >
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700 }}>{p.name}</div>
                    <div style={{ fontSize: 11, color: steel, fontFamily: mono, marginTop: 2 }}>{p.sku} · {p.category}</div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    {tone !== 'ok' && (
                      <span style={{ background: tone === 'critical' ? rust : amber, color: tone === 'critical' ? '#fff' : ink, fontSize: 9, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', padding: '3px 8px' }}>
                        {tone === 'critical' ? 'Out of stock' : 'Low stock'}
                      </span>
                    )}
                    <span style={{ fontFamily: mono, fontSize: 15, fontWeight: 700, color: tone === 'critical' ? rust : tone === 'low' ? '#8a6414' : moss }}>{p.quantity}</span>
                    <span style={{ color: steel, fontSize: 18 }}>›</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      )}

      {view === 'products' && selectedId && (() => {
        const p = products.find(x => x.id === selectedId);
        if (!p) { setSelectedId(null); return null; }
        const pct = p.reorder > 0 ? (p.quantity / (p.reorder * 2)) * 100 : (p.quantity > 0 ? 100 : 0);
        const tone = p.quantity === 0 ? 'critical' : p.quantity <= p.reorder ? 'low' : 'ok';
        return (
          <div style={{ padding: '20px 24px' }}>
            <button onClick={() => setSelectedId(null)} style={{ background: 'none', border: 'none', color: steel, fontSize: 13, cursor: 'pointer', padding: 0, marginBottom: 16 }}>← Back to products</button>
            <div style={{ maxWidth: 360, background: '#fff', border: `1px solid ${ink}22`, position: 'relative' }}>
              <div style={{ padding: '10px 14px', borderBottom: `1px dashed ${ink}44` }}>
                <Barcode seed={p.sku} />
              </div>
              <div style={{ padding: '12px 14px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontFamily: mono, fontSize: 11, color: steel }}>{p.sku}</div>
                  <div style={{ fontSize: 10, letterSpacing: 1, textTransform: 'uppercase', color: steel }}>{p.category}</div>
                </div>
                <div style={{ fontSize: 15, fontWeight: 700, margin: '4px 0 10px' }}>{p.name}</div>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                  <span style={{ fontFamily: mono, fontSize: 20, fontWeight: 700, color: tone === 'critical' ? rust : tone === 'low' ? '#8a6414' : moss }}>{p.quantity}</span>
                  <span style={{ fontSize: 11, color: steel }}>units · reorder at {p.reorder}</span>
                </div>
                <Gauge pct={pct} tone={tone} />

                <div style={{ display: 'flex', justifyContent: 'space-between', margin: '10px 0 12px', fontSize: 12, color: steel }}>
                  <span>₵{p.price.toFixed(2)} / unit</span>
                  <span>₵{(p.price * p.quantity).toLocaleString(undefined, { maximumFractionDigits: 0 })} value</span>
                </div>

                <div style={{ display: 'flex', gap: 6 }}>
                  <button onClick={() => openAdjust(p, 'in')} style={{ flex: 1, padding: '7px 0', fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', background: moss, color: '#fff', border: 'none', cursor: 'pointer' }}>+ In</button>
                  <button onClick={() => openAdjust(p, 'out')} style={{ flex: 1, padding: '7px 0', fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', background: amber, color: ink, border: 'none', cursor: 'pointer' }}>− Out</button>
                  <button onClick={() => openEdit(p)} style={{ padding: '7px 10px', fontSize: 11, background: 'none', color: steel, border: `1px solid ${ink}33`, cursor: 'pointer' }}>Edit</button>
                  <button onClick={() => { removeProduct(p); setSelectedId(null); }} style={{ padding: '7px 12px', fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', background: 'none', color: rust, border: `1px solid ${rust}55`, cursor: 'pointer' }}>Delete</button>
                </div>
              </div>
              {tone !== 'ok' && (
                <div style={{ position: 'absolute', top: 0, right: 0, background: tone === 'critical' ? rust : amber, color: tone === 'critical' ? '#fff' : ink, fontSize: 9, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', padding: '3px 8px' }}>
                  {tone === 'critical' ? 'Out of stock' : 'Low stock'}
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {adjustTarget && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(27,31,29,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50 }} onClick={() => setAdjustTarget(null)}>
          <div style={{ background: '#fff', width: 320, padding: 24, border: `2px solid ${ink}` }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: 'uppercase', color: steel, marginBottom: 4 }}>{adjustMode === 'in' ? 'Receive stock' : 'Remove stock'}</div>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>{adjustTarget.name}</div>
            <input
              type="number" autoFocus placeholder="Quantity" value={adjustQty}
              onChange={e => setAdjustQty(e.target.value)}
              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 12px', fontSize: 15, fontFamily: mono, border: `1px solid ${ink}44`, marginBottom: 10, borderRadius: 0 }}
            />
            <input
              placeholder="Note (optional)" value={adjustNote}
              onChange={e => setAdjustNote(e.target.value)}
              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 12px', fontSize: 13, border: `1px solid ${ink}44`, marginBottom: 16, borderRadius: 0, fontFamily: display }}
            />
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={commitAdjust} disabled={!adjustQty || Number(adjustQty) <= 0} style={{ flex: 1, padding: '10px 0', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: adjustMode === 'in' ? moss : amber, color: adjustMode === 'in' ? '#fff' : ink, border: 'none', cursor: 'pointer' }}>
                Confirm
              </button>
              <button onClick={() => setAdjustTarget(null)} style={{ flex: 1, padding: '10px 0', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: 'none', border: `1px solid ${ink}44`, cursor: 'pointer' }}>
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}

      {editTarget && editForm && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(27,31,29,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50 }} onClick={() => setEditTarget(null)}>
          <div style={{ background: '#fff', width: 320, padding: 24, border: `2px solid ${ink}` }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: 'uppercase', color: steel, marginBottom: 4 }}>Edit product · {editTarget.sku}</div>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>{editTarget.name}</div>
            <input
              placeholder="Product name" value={editForm.name}
              onChange={e => setEditForm({ ...editForm, name: e.target.value })}
              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 12px', fontSize: 14, border: `1px solid ${ink}44`, marginBottom: 10, borderRadius: 0, fontFamily: display }}
            />
            <select
              value={editForm.category} onChange={e => setEditForm({ ...editForm, category: e.target.value })}
              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 12px', fontSize: 14, border: `1px solid ${ink}44`, marginBottom: 10, borderRadius: 0, fontFamily: display }}
            >
              {CATS.map(c => <option key={c}>{c}</option>)}
            </select>
            <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
              <input
                type="number" placeholder="Reorder point" value={editForm.reorder}
                onChange={e => setEditForm({ ...editForm, reorder: e.target.value })}
                style={{ flex: 1, boxSizing: 'border-box', padding: '10px 12px', fontSize: 14, fontFamily: mono, border: `1px solid ${ink}44`, borderRadius: 0 }}
              />
              <input
                type="number" placeholder="Unit price (₵)" value={editForm.price}
                onChange={e => setEditForm({ ...editForm, price: e.target.value })}
                style={{ flex: 1, boxSizing: 'border-box', padding: '10px 12px', fontSize: 14, fontFamily: mono, border: `1px solid ${ink}44`, borderRadius: 0 }}
              />
            </div>
            <div style={{ fontSize: 11, color: steel, marginBottom: 12 }}>Quantity and SKU can't be changed here — use + In / − Out to adjust stock.</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={commitEdit} disabled={!editForm.name.trim()} style={{ flex: 1, padding: '10px 0', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: ink, color: paper, border: 'none', cursor: 'pointer' }}>
                Save changes
              </button>
              <button onClick={() => setEditTarget(null)} style={{ flex: 1, padding: '10px 0', fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase', background: 'none', border: `1px solid ${ink}44`, cursor: 'pointer' }}>
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}

      {view === 'dashboard' && (
        <div style={{ padding: '20px 24px 40px' }}>
          <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: steel, fontWeight: 700, marginBottom: 14 }}>Recent activity</div>
          {log.length === 0 ? (
            <div style={{ fontSize: 12, color: steel }}>No movements recorded yet.</div>
          ) : (
            <div style={{ fontFamily: mono, fontSize: 12, border: `1px solid ${ink}22` }}>
              {log.slice(0, 5).map((e, i) => (
                <div key={e.id} style={{ display: 'flex', gap: 10, padding: '6px 10px', background: i % 2 === 0 ? '#fff' : paperDark, borderBottom: `1px solid ${ink}11` }}>
                  <span style={{ color: steel, minWidth: 130 }}>{new Date(e.ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                  <span style={{ minWidth: 90, fontWeight: 700 }}>{e.user}</span>
                  <span style={{ minWidth: 60, textTransform: 'uppercase', fontSize: 10, fontWeight: 700, color: e.type === 'in' ? moss : e.type === 'out' ? '#8a6414' : e.type === 'removed' ? rust : steel }}>{e.type}</span>
                  <span style={{ flex: 1 }}>{e.name}</span>
                  <span style={{ fontWeight: 700 }}>{e.type === 'out' ? '−' : e.type === 'in' ? '+' : ''}{e.qty}</span>
                </div>
              ))}
            </div>
          )}
          <button onClick={() => setView('log')} style={{ marginTop: 12, background: 'none', border: 'none', color: amber, fontSize: 12, cursor: 'pointer', padding: 0, textDecoration: 'underline' }}>View full activity log →</button>
        </div>
      )}

      {view === 'log' && (
      <div style={{ padding: '20px 24px 40px', borderTop: `1px solid ${ink}22` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: steel, fontWeight: 700 }}>Activity log</div>
          {log.length > 0 && !confirmClearLog && (
            <button onClick={() => setConfirmClearLog(true)} style={{ background: 'none', border: 'none', color: rust, fontSize: 11, cursor: 'pointer', padding: 0, textDecoration: 'underline' }}>clear log</button>
          )}
          {confirmClearLog && (
            <span style={{ fontSize: 11, display: 'flex', gap: 8, alignItems: 'center' }}>
              <span style={{ color: steel }}>Clear all history?</span>
              <button onClick={clearLog} style={{ background: rust, color: '#fff', border: 'none', padding: '3px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>Yes, clear</button>
              <button onClick={() => setConfirmClearLog(false)} style={{ background: 'none', border: `1px solid ${ink}44`, padding: '3px 10px', fontSize: 11, cursor: 'pointer' }}>Cancel</button>
            </span>
          )}
        </div>
        {log.length === 0 ? (
          <div style={{ fontSize: 12, color: steel }}>No movements recorded yet.</div>
        ) : (
          <div style={{ fontFamily: mono, fontSize: 12, maxHeight: 260, overflowY: 'auto', border: `1px solid ${ink}22` }}>
            {log.slice(0, 40).map((e, i) => (
              <div key={e.id} style={{ display: 'flex', gap: 10, padding: '6px 10px', background: i % 2 === 0 ? '#fff' : paperDark, borderBottom: `1px solid ${ink}11` }}>
                <span style={{ color: steel, minWidth: 130 }}>{new Date(e.ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                <span style={{ minWidth: 90, fontWeight: 700 }}>{e.user}</span>
                <span style={{
                  minWidth: 60, textTransform: 'uppercase', fontSize: 10, fontWeight: 700,
                  color: e.type === 'in' ? moss : e.type === 'out' ? '#8a6414' : e.type === 'removed' ? rust : e.type === 'edited' ? steel : steel,
                }}>{e.type}</span>
                <span style={{ minWidth: 80, color: steel }}>{e.sku}</span>
                <span style={{ flex: 1 }}>{e.name}</span>
                <span style={{ fontWeight: 700 }}>{e.type === 'out' ? '−' : e.type === 'in' ? '+' : ''}{e.qty}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      )}
    </div>
  );
}
</script>
</body>
</html>
